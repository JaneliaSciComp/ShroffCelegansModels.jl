# CephFS PVC for /var/www/shroff/data/ (185MB HDF5 files migrated from VM).
# Static web files (index.html etc.) are baked into the image — not stored here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shroff-data-test-www
  namespace: shroff-data-test
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ocs-storagecluster-cephfs
  resources:
    requests:
      storage: 10Gi
---
# NFS PV/PVC for /nearline/shroff (Shroff Lab microscopy data — read by Julia apps)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shroff-data-test-nearline
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: nearline.hhmi.org
    path: /nearline3/shroff
    readOnly: true
---
---
# CephFS PVC for annotation_changes.h5 (user edits that must survive pod restarts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shroff-data-test-annotations
  namespace: shroff-data-test
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ocs-storagecluster-cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shroff-data-test-nearline
  namespace: shroff-data-test
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: shroff-data-test-nearline
  resources:
    requests:
      storage: 1Ti
