# Runs every 15 minutes; checks the shared annotations PVC for a
# `pending_recompute` marker written by the daily save-modified-times CronJob.
# When the marker is present, executes the recompute pipeline (currently a
# stub) and removes the marker on success.
#
# Uses the default ServiceAccount — no special RBAC needed because all
# coordination happens via files on the shared PVC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recompute-on-mtime-change
  namespace: shroff-data-test
  labels:
    app: shroff-data-test
    component: recompute-on-mtime-change
spec:
  schedule: "*/15 * * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app: shroff-data-test
            component: recompute-on-mtime-change
        spec:
          restartPolicy: Never
          containers:
            - name: recompute-on-mtime-change
              image: image-registry.openshift-image-registry.svc:5000/shroff-data-test/shroff-data-test:latest
              command:
                - julia
                - --threads=auto
                - --project=/app/ShroffCelegansModels.jl/web
                - /app/ShroffCelegansModels.jl/web/scripts/run_recompute_if_needed.jl
              workingDir: /app/ShroffCelegansModels.jl
              env:
                - name: MODIFIED_TIMES_DIR
                  value: /data/annotations/modified_times
              volumeMounts:
                - name: nearline
                  mountPath: /nearline/shroff
                  readOnly: true
                - name: annotations
                  mountPath: /data/annotations
              resources:
                requests:
                  memory: 4Gi
                  cpu: 500m
                limits:
                  memory: 8Gi
                  cpu: "4"
          volumes:
            - name: nearline
              persistentVolumeClaim:
                claimName: shroff-data-test-nearline
            - name: annotations
              persistentVolumeClaim:
                claimName: shroff-data-test-annotations
