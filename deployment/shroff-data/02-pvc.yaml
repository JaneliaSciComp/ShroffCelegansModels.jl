# CephFS PVC for /var/www/shroff/data/ (185MB HDF5 files migrated from VM).
# Static web files (index.html etc.) are baked into the image — not stored here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shroff-data-www
  namespace: shroff-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ocs-storagecluster-cephfs
  resources:
    requests:
      storage: 10Gi
---
# NFS PV/PVC for /nearline/shroff (Shroff Lab microscopy data — read by Julia apps)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shroff-data-nearline
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: nearline.hhmi.org
    path: /nearline3/shroff
    readOnly: true
---
---
# CephFS PVC for annotation_changes.h5 (user edits) AND the recompute pipeline
# output dir (/data/annotations/recompute: averaged HDF5s, caches, movies, the
# interactive meshscatter_latest.html, archives). 20Gi matches the test env;
# the recompute outputs + archives are ~300MB+ and grow per run. cephfs
# allowVolumeExpansion=true, so this is an online resize.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shroff-data-annotations
  namespace: shroff-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ocs-storagecluster-cephfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shroff-data-nearline
  namespace: shroff-data
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: shroff-data-nearline
  resources:
    requests:
      storage: 1Ti
